[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-archiver"
version = "0.1.0"
description = "Manipulation of Nintendo Switch containers (XCI / NSP / NSZ)"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

# Console scripts in kebab-case (Python modules stay in snake_case, PEP 8).
[project.scripts]
xci-extract = "nx_archiver.cli.xci_extract:main"
nsp-to-xci = "nx_archiver.cli.nsp_to_xci:main"
xci-modify = "nx_archiver.cli.xci_modify:main"
make-xci = "nx_archiver.cli.make_xci:main"
xci-update = "nx_archiver.cli.xci_update:main"
xci-trim = "nx_archiver.cli.xci_trim:main"

[tool.setuptools.packages.find]
include = ["nx_archiver*"]

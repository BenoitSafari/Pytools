[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tools"
version = "0.1.0"
description = "Utilities for AI/agents: Claude data export, image compression"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

# Console scripts in kebab-case (Python modules stay in snake_case, PEP 8).
[project.scripts]
claude-export = "ai_tools.cli.claude_export:main"
img-resize = "ai_tools.cli.img_resize:main"

[tool.setuptools.packages.find]
include = ["ai_tools*"]
